[project]
name = "stac-floodplains-bc"
version = "0.1.0"
description = "Publish layer for the stac-floodplains-bc STAC collection (COG + STAC register steps)."
# The SCRIPTS, matching stac_dem_bc and stac_uav_bc. Not the published catalogue: the
# collection's own `license` field is CC-BY-4.0, because the products are a derivative of
# a CC BY 4.0 source (#47). Two licences over two different things — see README Attribution.
license = "MIT"
# 3.11, not 3.10: rio-cogeo 7 requires it, and the floor was aspirational rather
# than exercised — the venv on this machine is 3.12.13 and the committed bytecode
# is cpython-312/314. Nothing has run this on 3.10.
requires-python = ">=3.11"
dependencies = [
    "pystac>=1.12.0",
    "rio-stac>=0.11.0",
    "rasterio>=1.4.0",
    # Layout validation only (item_validate.py). Pure-Python wheel riding the existing
    # rasterio/GDAL, so it does not reopen the conda->uv blocker this repo cleared.
    # It is not dependency-free though: morecantile pulls pyproj, which bundles its own
    # PROJ. Unused here (nothing in the validator reprojects, and cog_validate does not
    # touch PROJ) but worth naming rather than claiming nothing binary came along.
    "rio-cogeo>=7.0.0",
    "shapely",
    "pyarrow",
    "tqdm",
    "jsonschema",
]

# Scripts-only repo — not an installable package; uv just manages the dependency env.
[tool.uv]
package = false
